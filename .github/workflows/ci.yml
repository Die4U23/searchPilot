name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,research]"
      - name: Ruff check
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy src
      - name: Pytest (unit, integration excluded by default)
        run: python -m pytest

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: searchpilot
          POSTGRES_PASSWORD: searchpilot
          POSTGRES_DB: searchpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U searchpilot -d searchpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SEARCHPILOT_DATABASE_URL: postgresql://searchpilot:searchpilot@localhost:5432/searchpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,research]"
      - name: Pytest (integration)
        # 不允许「没收集到测试」或 skip 蒙混过关：这里必须真正连库跑完。
        run: python -m pytest -m integration --no-header -rs
