# Optional paid/external model execution. Use alongside docker-compose.yml.
services:
  api:
    environment:
      SEARCHPILOT_AGENT_MODE: llm
      SEARCHPILOT_AGENT_LLM_ENDPOINT: ${SEARCHPILOT_AGENT_LLM_ENDPOINT:?Set Agent endpoint}
      SEARCHPILOT_AGENT_LLM_MODEL: ${SEARCHPILOT_AGENT_LLM_MODEL:?Set Agent model}
      SEARCHPILOT_AGENT_LLM_API_KEY: ${SEARCHPILOT_AGENT_LLM_API_KEY:-}
      SEARCHPILOT_AGENT_MAX_STEPS: ${SEARCHPILOT_AGENT_MAX_STEPS:-8}
      SEARCHPILOT_AGENT_TIMEOUT_SECONDS: ${SEARCHPILOT_AGENT_TIMEOUT_SECONDS:-90}
      SEARCHPILOT_AGENT_MAX_CONCURRENT_RUNS: ${SEARCHPILOT_AGENT_MAX_CONCURRENT_RUNS:-2}
