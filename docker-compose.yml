services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: searchpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-searchpilot}
      POSTGRES_DB: searchpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchpilot -d searchpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SEARCHPILOT_DATABASE_URL: postgresql://searchpilot:${POSTGRES_PASSWORD:-searchpilot}@db:5432/searchpilot
      SEARCHPILOT_DATA_DIR: /app/data
      SEARCHPILOT_ARTIFACT_DIR: /app/artifacts
      SEARCHPILOT_DATA_VERSION: ${SEARCHPILOT_DATA_VERSION:-}
      SEARCHPILOT_MAX_QUERY_CHARS: ${SEARCHPILOT_MAX_QUERY_CHARS:-256}
      SEARCHPILOT_MAX_LIMIT: ${SEARCHPILOT_MAX_LIMIT:-100}
      SEARCHPILOT_LOG_LEVEL: ${SEARCHPILOT_LOG_LEVEL:-INFO}
      SEARCHPILOT_DB_POOL_MIN: ${SEARCHPILOT_DB_POOL_MIN:-1}
      SEARCHPILOT_DB_POOL_MAX: ${SEARCHPILOT_DB_POOL_MAX:-4}
      SEARCHPILOT_API_TOKEN: ${SEARCHPILOT_API_TOKEN:-}
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts:ro
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
